[project]
name = "media-grab-bot"
version = "0.1.0"
description = "Personal Telegram bot that downloads Instagram and X media"
requires-python = ">=3.12"
dependencies = [
    "python-telegram-bot>=21",
    "httpx",
    "python-dotenv",
    "yt-dlp",
    "gallery-dl",
]

[dependency-groups]
dev = ["pytest", "pytest-asyncio"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["bot"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
